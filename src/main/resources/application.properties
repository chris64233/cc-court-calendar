spring.application.name=cc-court-calendar
spring.datasource.url=jdbc:h2:file:./data/cc-court-calendar
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# 法官相邻庭审之间必须保留的缓冲时间（ISO-8601 时长）
courtcalendar.judge-buffer=PT15M
