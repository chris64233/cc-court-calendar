spring.application.name=cc-court-calendar
spring.datasource.url=jdbc:h2:file:./data/cc-court-calendar
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# 所有实体访问均在服务层事务内完成，关闭 OSIV 避免视图阶段隐式加载
spring.jpa.open-in-view=false
# 法官相邻两场庭审之间必须保留的缓冲时间
courtcalendar.judge-buffer=PT15M
